# 本机自用预览：http://127.0.0.1:18330
# 数据全部落在项目目录 ./data（SQLite、每日备份、导出预览），删容器不影响数据。
name: pc-52a8eeac-develop

services:
  backend:
    build: ./backend
    image: pc-52a8eeac-backend:local
    restart: unless-stopped
    # 用宿主用户身份跑，避免在项目目录里写出 root 属主的文件
    user: "1000:1000"
    environment:
      CP_DATA_DIR: /data
      CP_VAULT_DIR: /vault
      CP_BACKUP_DIR: /data/backups
      CP_EXPORT_DIR: /data/exports
      PYTHONUNBUFFERED: "1"
    volumes:
      # 数据、备份、导出预览都在项目目录内
      - ./data:/data
      # vault 只读来源（正式写回不在当前版本范围内）
      - ../../my-vault:/vault:ro

  frontend:
    build: ./frontend
    image: pc-52a8eeac-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18330:80"
